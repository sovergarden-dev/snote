name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Application checks exercise only local behavior. Keep them deterministic and
# available to fork PRs without exposing or depending on repository secrets.
env:
  VITE_SUPABASE_URL: https://ci.invalid
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -shellcheck=
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify Bun Node-compat floor
        run: |
          bun -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 22)) { console.error(`Bun Node-compat ${process.versions.node} is below the required 22.22.0`); process.exit(1); } console.log(`Bun Node-compat ${process.versions.node} satisfies >=22.22.0`);'
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.3
      - run: bun install --frozen-lockfile
      - run: bash scripts/retry-bun-audit.sh
      - run: bun run lint
      - run: bun run knip
      - run: bun run i18n:check
      - run: bun run i18n:allowlist
      - run: bunx tsc --noEmit -p tsconfig.app.json
      - run: bunx tsc --noEmit -p tsconfig.node.json
      - run: bunx tsc --noEmit -p tsconfig.tools.json
      - run: bun run typecheck:edge
      - run: bun run test:coverage
      - name: Verify ordinary build manifest
        run: |
          bun run build:check
          bun -e 'const { deployedSha, capabilityRoutesEnabled } = await Bun.file("dist/version.json").json(); if (deployedSha !== null) throw new Error("ordinary version artifact must remain unattested"); if (capabilityRoutesEnabled !== false) throw new Error("ordinary version artifact must attest disabled capability routes");'
      - name: Verify source-attested release build
        env:
          SNOTE_RELEASE_SHA: ${{ github.sha }}
          VITE_CAPABILITY_ROUTES_ENABLED: "true"
        run: |
          bun run build:release
          bun -e 'const { deployedSha, capabilityRoutesEnabled } = await Bun.file("dist/version.json").json(); if (deployedSha !== process.env.SNOTE_RELEASE_SHA) throw new Error("release version artifact must attest checked-out SHA"); if (capabilityRoutesEnabled !== true) throw new Error("release version artifact must attest enabled capability routes");'

  e2e-pr:
    name: e2e-pr
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run critical Chromium smoke
        run: >-
          bunx playwright test
          e2e/critical-a11y.spec.ts
          e2e/pwa-update-sw-stall.spec.ts
          e2e/pwa-update-throttle.spec.ts
          --project=chromium
          --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-pr-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-full:
    name: e2e-full-${{ matrix.browser }}
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run full browser suite
        run: bunx playwright test --project=${{ matrix.browser }} --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-full-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

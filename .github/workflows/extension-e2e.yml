name: Extension E2E

on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/**"
      - "e2e-extension/**"
      - "scripts/audit-extension.sh"
      - "scripts/retry-bun-audit.sh"
      - "scripts/build-extension-zip.ts"
      - "scripts/extension-archive.ts"
      - "scripts/verify-extension-zip.ts"
      - "scripts/verify-extension-zip.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/extension-e2e.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension-e2e:
    name: extension-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify-extension-zip.sh
      - run: bash scripts/audit-extension.sh
      - run: bunx playwright install --with-deps chromium
      - name: Run unpacked extension suite
        id: extension-playwright
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x800x24"
          bunx playwright test
          --config=e2e-extension/playwright.config.ts
          --retries=0
      # Playwright resolves outputDir/reporter folders relative to its
      # config directory (e2e-extension/), so the evidence lives under
      # e2e-extension/ — NOT the repo root. Source and the shipped zip are
      # recoverable from the commit SHA and are not failure evidence.
      - name: Upload failure evidence
        if: failure() && steps.extension-playwright.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extension-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          # A path drift must surface as a failed upload, not silently
          # produce a useless artifact.
          path: |
            e2e-extension/playwright-report/
            e2e-extension/test-results/
          if-no-files-found: error
          retention-days: 14

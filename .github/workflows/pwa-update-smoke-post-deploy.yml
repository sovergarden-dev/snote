name: PWA update smoke

# Cloudflare Pages does not create GitHub Deployments for this repo (API
# returns 0 records), so deployment_status never fires. SPA-affecting
# main pushes wait up to 8 minutes for live /version.json SHA; origin
# auto-builds in ~3 minutes after those merges. Docs-only and src
# test-only merges are filtered out so attestation does not wait on a
# SHA origin never ships. GitHub rejects `paths` + `paths-ignore` on
# the same event; use `!` patterns after `src/**` instead (no braces).
# Exclude src/integrations/supabase/types.ts: generated from SQL, not
# Pages-shipped. L2 decide job uses SPA_SHIP_GLOBS in
# scripts/spa-ship-globs.ts (Pulse: skip live SHA on non-SPA merges).
# Manual workflow_dispatch remains the button when origin is shipped later.
on:
  deployment_status:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**/__tests__/**"
      - "!src/**/*.test.*"
      - "!src/**/*.spec.*"
      - "!src/integrations/supabase/types.ts"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "postcss.config.js"
      - "tailwind.config.ts"
      - "components.json"
      - "scripts/build-release.ts"
      - "scripts/release-identity.ts"
      - ".env"
      - ".env.example"
  workflow_dispatch:
    inputs:
      target_url:
        description: Base URL to smoke-test
        required: false
        default: https://note.syrin.online
      expected_sha:
        description: Exact deployed commit SHA expected in /version.json
        required: true
        type: string
      expected_capability_routes_enabled:
        description: Expected capability route state in /version.json
        required: true
        type: choice
        default: "true"
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decide:
    name: decide
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_smoke: ${{ steps.decide.outputs.run_smoke }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'push'
        with:
          bun-version: 1.3.14
      - name: Decide whether to run live SHA smoke
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            echo "non-push event: run smoke"
            exit 0
          fi
          bun run scripts/spa-ship-globs.ts

  smoke:
    name: pwa-update-smoke
    needs: decide
    if: needs.decide.outputs.run_smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SMOKE_BASE_URL: >-
        ${{
          github.event.deployment_status.target_url ||
          github.event.inputs.target_url ||
          'https://note.syrin.online'
        }}
      EXPECTED_DEPLOYED_SHA: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.expected_sha ||
          github.event_name == 'deployment_status' &&
          github.event.deployment.sha ||
          github.sha
        }}
      EXPECTED_CAPABILITY_ROUTES_ENABLED: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.expected_capability_routes_enabled ||
          'true'
        }}
      LIVE_RELEASE_WAIT_MS: >-
        ${{
          github.event_name == 'push' &&
          '480000' ||
          '0'
        }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify live release identity
        run: bun run scripts/verify-live-release.ts
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify-frame-ancestors.sh "$SMOKE_BASE_URL"
      - run: bunx playwright install --with-deps chromium
      - name: Run post-deploy smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.SMOKE_BASE_URL }}
        run: >-
          bunx playwright test
          e2e/pwa-update-multi-click.spec.ts
          e2e/pwa-update-no-url-v-param.spec.ts
          --project=chromium
          --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pwa-update-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
